plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.cdp'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    // Neo4j Java Driver (for identity stitching)
    implementation 'org.neo4j.driver:neo4j-java-driver:5.14.0'
    
    // MongoDB Driver (for profile storage)
    implementation 'org.mongodb:mongodb-driver-sync:4.11.1'
    implementation 'org.mongodb:bson:4.11.1'
    
    // JSON Processing
    implementation 'com.fasterxml.jackson.core:jackson-core:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'
    
    // Apache Commons Text (for string manipulation) Fuzzy Matching
    implementation 'org.apache.commons:commons-text:1.11.0'

    // Apache Flink (provided by cluster, not bundled in JAR)
    compileOnly 'org.apache.flink:flink-streaming-java:1.18.0'
    compileOnly 'org.apache.flink:flink-clients:1.18.0'
    
    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'org.slf4j:slf4j-simple:2.0.9'
    
    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Shadow JAR configuration - bundles dependencies
shadowJar {
    archiveBaseName.set('flink-jobs')
    archiveClassifier.set('all')
    archiveVersion.set('1.0-SNAPSHOT')
    
    // Set main class for job execution
    manifest {
        attributes 'Main-Class': 'com.cdp.jobs.SocketStreamJob'
    }
    
    // Exclude Flink dependencies (provided by cluster)
    dependencies {
        exclude(dependency('org.apache.flink:.*'))
    }
    
    // Relocate dependencies to avoid conflicts
    relocate 'com.google.common', 'shadow.com.google.common'
    relocate 'com.fasterxml.jackson', 'shadow.com.fasterxml.jackson'
    
    mergeServiceFiles()
}

// Make shadowJar the default build task
build.dependsOn shadowJar

// Enable JUnit 5
test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}